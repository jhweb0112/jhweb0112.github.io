<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>학습 유형 검사</title>
<style type="text/css">
	*{margin: 0; padding: 0;}	
	#myVideo{width: 100%;}
</style>
</head>

<body style="background: red;">
<video id="myVideo" loop autoplay muted >
  <source src="PC_type.mp4" type="video/mp4">
</video>
	
<script>
  const video = document.getElementById('myVideo');
  
  // 반복할 구간 설정 (초 단위)
  const startTime =1.5; // 시작 시간 (예: 3.5초)
  const endTime = 12.7;   // 종료 시간 (예: 7초)

  video.addEventListener('timeupdate', function() {
    // 현재 시간이 종료 시간보다 크거나 같으면 시작 시간으로 이동
    if (video.currentTime >= endTime) {
      video.currentTime = startTime;
      video.play();
    }
  });

  // 영상이 처음 로드될 때 지정한 시작부터 재생되도록 설정
  video.addEventListener('loadedmetadata', function() {
    video.currentTime = 0;
  });
</script>
</body>
</html>
