<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>학습 유형 검사</title>
<style type="text/css">
	*{margin: 0; padding: 0;}	
	#lottie-1{width: 100%; background: url("circle@1x-10fps.gif") no-repeat center; background-size:68% ahto; }
	#lottie-2{width:1920px; background: url("circle@1x-10fps.gif") no-repeat center; background-size:68% ahto;}
</style>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.11/lottie.min.js"></script>
	<script src="https://unpkg.com/@lottiefiles/lottie-interactivity@latest/dist/lottie-interactivity.min.js"></script>
	<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>

<body style="background: #fff;">
 <!-- 애니메이션이 들어갈 개별 컨테이너 -->
    <div id="lottie-1" class="lottie-box"></div>
    <div id="lottie-2" class="lottie-box"></div>

    <script>
        // --- 1번 애니메이션 설정 (예: 0~30프레임 반복) ---
        const anim1 = bodymovin.loadAnimation({
            container: document.getElementById('lottie-1'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'PC_type_new.json'
        });
        anim1.addEventListener('loopComplete', function() {
            anim1.playSegments([85, 787], true);
						anim1.removeEventListener('loopComplete'); 
        });

        // --- 2번 애니메이션 설정 (예: 40~90프레임 반복) ---
        const anim2 = bodymovin.loadAnimation({
            container: document.getElementById('lottie-2'),
            renderer: 'svg',
            loop: true,
            autoplay: false,
            path: 'PC_type_new.json'
        });
        anim2.addEventListener('DOMLoaded', function() {
            anim2.playSegments([85, 787], true);
        });
    </script>
</body>
</html>
