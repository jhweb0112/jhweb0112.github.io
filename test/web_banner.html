<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>학습 유형 검사</title>
<style type="text/css">
	*{margin: 0; padding: 0;}
	.lottie-box1{display: block;}
	.lottie-box2, .lottie-box3{display: none;}
	#lottie-1{width: 100%; background: url("circle@1x-10fps.gif") no-repeat center; background-size:68% auto;}
	#lottie-2{ width:100%; background: url("circle@1x-10fps.gif") no-repeat center; background-size:107% auto;}
	#lottie-3{width: 100%; background: url("circle@1x-10fps.gif") no-repeat center -20%; background-size:107% auto;}
	@media (max-width: 768px) {
		.lottie-box2{display: block;}
		.lottie-box1, .lottie-box3{display: none;}
	}
	@media (max-width: 576px) {
		.lottie-box3{display: block;}
		.lottie-box1, .lottie-box2{display: none;}		
	}
</style>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.7.11/lottie.min.js"></script>
	<script src="https://unpkg.com/@lottiefiles/lottie-interactivity@latest/dist/lottie-interactivity.min.js"></script>
	<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>

<body style="background: #fff;">
 <!-- 애니메이션이 들어갈 개별 컨테이너 -->
    <a href="#" class="lottie-box1"><p>PC</p><div id="lottie-1"></div></a>
    <a href="#" class="lottie-box2"><p>태블릿</p><div id="lottie-2"></div></a>
    <a href="#" class="lottie-box3"><p>모바일</p><div id="lottie-3"></div></a>

    <script>
        // --- 1번 애니메이션 : PC ---
        const anim1 = bodymovin.loadAnimation({
            container: document.getElementById('lottie-1'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'PC_type.json'
        });
        anim1.addEventListener('loopComplete', function() {
            anim1.playSegments([85, 786], true);
						anim1.removeEventListener('loopComplete'); 
        });

        // --- 2번 애니메이션 : 태블릿 ---
        const anim2 = bodymovin.loadAnimation({
            container: document.getElementById('lottie-2'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'Tablet_type.json'
        });
        anim2.addEventListener('loopComplete', function() {
            anim2.playSegments([85, 786], true);
						anim2.removeEventListener('loopComplete'); 
        });

        // --- 1번 애니메이션 : 모바일 ---
        const anim3 = bodymovin.loadAnimation({
            container: document.getElementById('lottie-3'),
            renderer: 'svg',
            loop: true,
            autoplay: true,
            path: 'mo_type.json'
        });
        anim3.addEventListener('loopComplete', function() {
            anim3.playSegments([85, 624], true);
						anim3.removeEventListener('loopComplete'); 
        });
    </script>
</body>
</html>
